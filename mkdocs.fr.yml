site_name: Documentation d’AUCOOP Mint
site_description: Documentation pour utiliser, préparer et développer AUCOOP Mint.
site_url: https://aucoop.github.io/AUCOOP-Mint/fr/
site_dir: site/fr
docs_dir: docs/fr

repo_name: aucoop/AUCOOP-Mint
repo_url: https://github.com/aucoop/AUCOOP-Mint
edit_uri: edit/master/docs/fr/

theme:
  name: material
  language: fr
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Passer au thème clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Utiliser le thème du système

plugins:
  - search

extra_javascript:
  - assets/language-selector.js

extra:
  homepage: https://github.com/aucoop/AUCOOP-Mint
  alternate:
    - name: English
      link: https://aucoop.github.io/AUCOOP-Mint/
      lang: en
    - name: Español
      link: https://aucoop.github.io/AUCOOP-Mint/es/
      lang: es
    - name: Français
      link: https://aucoop.github.io/AUCOOP-Mint/fr/
      lang: fr
    - name: Català
      link: https://aucoop.github.io/AUCOOP-Mint/ca/
      lang: ca

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Accueil: index.md
  - Préparer un ordinateur:
      - Démarrage rapide: deployment/quick-start.md
      - Première connexion: deployment/first-boot.md
      - Connexion lente ou absente: deployment/slow-internet.md
  - Utiliser l’ordinateur:
      - Ce qui est installé: use/index.md
      - Assistant IA hors ligne: use/offline-ai.md
  - Fonctionnement interne:
      - Architecture: architecture/index.md
      - Plan du dépôt: architecture/repository-map.md
      - Tests dans une machine virtuelle: testing/index.md
      - Référence technique: technical-reference.md
  - Dépannage: troubleshooting.md
