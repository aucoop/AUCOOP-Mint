site_name: Documentació d’AUCOOP Mint
site_description: Documentació per utilitzar, preparar i desenvolupar AUCOOP Mint.
site_url: https://aucoop.github.io/AUCOOP-Mint/ca/
site_dir: site/ca
docs_dir: docs/ca

repo_name: aucoop/AUCOOP-Mint
repo_url: https://github.com/aucoop/AUCOOP-Mint
edit_uri: edit/master/docs/ca/

theme:
  name: material
  language: ca
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Canvia al mode clar
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Canvia al mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Utilitza el mode del sistema

plugins:
  - search

extra_javascript:
  - assets/language-selector.js

extra:
  homepage: https://github.com/aucoop/AUCOOP-Mint
  alternate:
    - name: English
      link: https://aucoop.github.io/AUCOOP-Mint/
      lang: en
    - name: Español
      link: https://aucoop.github.io/AUCOOP-Mint/es/
      lang: es
    - name: Français
      link: https://aucoop.github.io/AUCOOP-Mint/fr/
      lang: fr
    - name: Català
      link: https://aucoop.github.io/AUCOOP-Mint/ca/
      lang: ca

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inici: index.md
  - Preparar un portàtil:
      - Guia ràpida: deployment/quick-start.md
      - Primer inici: deployment/first-boot.md
      - Internet lent o inexistent: deployment/slow-internet.md
  - Utilitzar el portàtil:
      - Què hi ha instal·lat: use/index.md
      - Assistent d’IA sense connexió: use/offline-ai.md
  - Per dins:
      - Arquitectura: architecture/index.md
      - Mapa del repositori: architecture/repository-map.md
      - Proves en una màquina virtual: testing/index.md
      - Referència tècnica: technical-reference.md
  - Solució de problemes: troubleshooting.md
