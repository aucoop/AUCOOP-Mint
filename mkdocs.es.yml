site_name: Documentación de AUCOOP Mint
site_description: Documentación de uso, preparación y desarrollo de AUCOOP Mint.
site_url: https://aucoop.github.io/AUCOOP-Mint/es/
site_dir: site/es
docs_dir: docs/es

repo_name: aucoop/AUCOOP-Mint
repo_url: https://github.com/aucoop/AUCOOP-Mint
edit_uri: edit/master/docs/es/

theme:
  name: material
  language: es
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar al modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar al modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Usar el modo del sistema

plugins:
  - search

extra_javascript:
  - assets/language-selector.js

extra:
  homepage: https://github.com/aucoop/AUCOOP-Mint
  alternate:
    - name: English
      link: https://aucoop.github.io/AUCOOP-Mint/
      lang: en
    - name: Español
      link: https://aucoop.github.io/AUCOOP-Mint/es/
      lang: es
    - name: Français
      link: https://aucoop.github.io/AUCOOP-Mint/fr/
      lang: fr
    - name: Català
      link: https://aucoop.github.io/AUCOOP-Mint/ca/
      lang: ca

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Preparar un portátil:
      - Guía rápida: deployment/quick-start.md
      - Primer inicio: deployment/first-boot.md
      - Internet lenta o sin conexión: deployment/slow-internet.md
  - Usar el portátil:
      - Qué incluye: use/index.md
      - Asistente de IA sin conexión: use/offline-ai.md
  - Por dentro:
      - Arquitectura: architecture/index.md
      - Mapa del repositorio: architecture/repository-map.md
      - Pruebas en una máquina virtual: testing/index.md
      - Referencia técnica: technical-reference.md
  - Solución de problemas: troubleshooting.md
